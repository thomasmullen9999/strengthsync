{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to continue tracking your progress.</p>

        <form action="/login" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input autocomplete="off" autofocus id="username" name="username" placeholder="Your username" type="text">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" placeholder="Your password" type="password">
            </div>

            <button class="btn-primary btn-full" type="submit">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
